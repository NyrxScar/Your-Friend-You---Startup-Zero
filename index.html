<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F3F8">
<title>Your Friend You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Lexend:wght@300;400;500;600&display=swap">
<style>
/* Layout: one phone-width app column, centered on larger screens, fixed bottom tab bar; sheets slide up, guided flows open full screen. */
:root{
  --bg:#F4F3F8; --surface:#FFFFFF; --ink:#37354A; --muted:#6C6A82; --line:#E3E1EC;
  --lav:#E6E0F7; --lav-ink:#5A4C97;
  --sage:#DDEEE4; --sage-ink:#3D6C55;
  --peach:#FBE4D8; --peach-ink:#8F5338;
  --sky:#DCEAF6; --sky-ink:#3B638B;
  --butter:#F7EFCF; --butter-ink:#6F5D1B;
  --rose:#F6DFE7; --rose-ink:#8A4862;
  --focus:#8C7BD6; --scrim:rgba(40,38,58,.38);
  --shadow:0 1px 2px rgba(55,53,74,.05),0 6px 18px rgba(55,53,74,.06);
  --f-display:"Fredoka","Lexend",system-ui,sans-serif;
  --f-body:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-lg:22px; --r-md:16px; --z:1;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1C1B24; --surface:#26252F; --ink:#ECEAF4; --muted:#A8A6BA; --line:#383747;
  --lav:#363052; --lav-ink:#CFC5F3; --sage:#2A3F33; --sage-ink:#B5DBC4;
  --peach:#463128; --peach-ink:#F2C6B0; --sky:#2A3A4C; --sky-ink:#B8D3EE;
  --butter:#433C22; --butter-ink:#EBDDA2; --rose:#462E39; --rose-ink:#F0BDD0;
  --focus:#B3A6EE; --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.25); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1C1B24; --surface:#26252F; --ink:#ECEAF4; --muted:#A8A6BA; --line:#383747;
  --lav:#363052; --lav-ink:#CFC5F3; --sage:#2A3F33; --sage-ink:#B5DBC4;
  --peach:#463128; --peach-ink:#F2C6B0; --sky:#2A3A4C; --sky-ink:#B8D3EE;
  --butter:#433C22; --butter-ink:#EBDDA2; --rose:#462E39; --rose-ink:#F0BDD0;
  --focus:#B3A6EE; --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.25); color-scheme:dark;
}
:root[data-contrast="high"]{ --muted:var(--ink); --line:var(--muted); --shadow:0 0 0 1.5px var(--ink) }
:root[data-low]{ --lav:var(--surface); --sage:var(--surface); --peach:var(--surface); --sky:var(--surface); --butter:var(--surface); --rose:var(--surface);
  --lav-ink:var(--muted); --sage-ink:var(--muted); --peach-ink:var(--muted); --sky-ink:var(--muted); --butter-ink:var(--muted); --rose-ink:var(--muted); --focus:var(--muted) }
:root[data-low] *{transition:none!important;animation:none!important}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:10px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.005em}
p{margin:0}
.zoom{zoom:var(--z)}

.app{max-width:480px;margin:0 auto;min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px calc(110px + env(safe-area-inset-bottom,0px));}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:4px 18px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:600;font-size:17px;text-decoration:none}
.brand-mark{width:34px;height:34px;border-radius:12px;background:var(--lav);display:grid;place-items:center}
.me-btn{width:44px;height:44px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;font-size:22px;text-decoration:none}

.screen{display:flex;flex-direction:column;gap:22px}
.head{display:flex;flex-direction:column;gap:6px}
.head h1{font-size:28px;line-height:1.15}
.sub{color:var(--muted);font-size:15px}
.label{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.section{display:flex;flex-direction:column;gap:12px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:15px;align-self:flex-start;padding:6px 0;text-decoration:none}
.panel{background:var(--surface);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.panel h2{font-size:19px}
.note{font-size:14px;color:var(--muted);background:var(--surface);border-radius:var(--r-md);padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.empty{text-align:center;color:var(--muted);font-size:15px;padding:24px 12px;background:var(--surface);border-radius:var(--r-md);grid-column:1/-1;list-style:none}

.c-lav{background:var(--lav);color:var(--lav-ink)} .c-sage{background:var(--sage);color:var(--sage-ink)}
.c-peach{background:var(--peach);color:var(--peach-ink)} .c-sky{background:var(--sky);color:var(--sky-ink)}
.c-rose{background:var(--rose);color:var(--rose-ink)} .c-butter{background:var(--butter);color:var(--butter-ink)}

.btn{padding:12px 18px;border-radius:14px;background:var(--lav);color:var(--lav-ink);font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;text-decoration:none;text-align:center}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.solid{background:var(--lav-ink);color:var(--surface)}
.btn.warn{background:var(--rose);color:var(--rose-ink)}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;min-height:36px;font-size:14px;border-radius:11px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns .btn{flex:1}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);font-size:15px;display:inline-flex;gap:8px;align-items:center;flex:none}
.panel .chip{background:var(--bg);box-shadow:none}
.chip[aria-pressed="true"]{background:var(--lav)!important;box-shadow:inset 0 0 0 1.5px var(--lav-ink)!important;color:var(--lav-ink);font-weight:500}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.tag{font-size:12px;padding:3px 9px;border-radius:999px;font-weight:500;white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.seg{display:flex;gap:6px;background:var(--surface);padding:5px;border-radius:999px;box-shadow:var(--shadow)}
.seg button{flex:1;padding:9px 6px;border-radius:999px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--sky);color:var(--sky-ink);font-weight:500}
.sheet .seg,.full .seg{box-shadow:inset 0 0 0 1.5px var(--line)}

.switch{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface);border-radius:var(--r-md);width:100%;text-align:left}
.switch .t{flex:1;min-width:0;display:flex;flex-direction:column}
.switch .t small{color:var(--muted);font-size:13px}
.tog{width:48px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
[aria-checked="true"] .tog{background:var(--lav-ink)}
[aria-checked="true"] .tog::after{left:23px}

.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .flabel{font-size:14px;font-weight:500}
.field input,.field select,.field textarea{padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);width:100%}
.field textarea{min-height:120px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--focus)}
.field small{color:var(--muted);font-size:13px}
.err{color:var(--rose-ink);font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.emoji-pick{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.emoji-pick button{font-size:24px;padding:8px 0;border-radius:12px;background:var(--surface)}
.emoji-pick button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--lav-ink);background:var(--lav)}
input[type=range]{width:100%;accent-color:var(--lav-ink)}

/* Home */
.greet h1{font-size:30px}
.next{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:var(--r-lg);background:var(--sage);color:var(--sage-ink)}
.next .row{display:flex;align-items:center;gap:14px}
.pict{width:56px;height:56px;border-radius:var(--r-md);background:var(--surface);display:grid;place-items:center;font-size:30px;flex:none}
.next .txt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.next strong{font-family:var(--f-display);font-size:19px;font-weight:600;color:var(--ink)}
.next small{font-size:14px}
.next .btns .btn{background:var(--surface);color:var(--sage-ink)}
.areas{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.area{border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:10px;min-height:128px;justify-content:space-between;text-decoration:none}
.area .ic{width:44px;height:44px;border-radius:14px;background:var(--surface);display:grid;place-items:center;flex:none}
.area .ic svg{width:24px;height:24px}
.area b{font-family:var(--f-display);font-weight:600;font-size:18px;display:block;color:var(--ink)}
.area span{font-size:13px;line-height:1.35}
.area.wide{grid-column:1/-1;flex-direction:row;align-items:center;min-height:0}
.pause{display:flex;align-items:center;justify-content:center;gap:10px;padding:16px;border-radius:var(--r-lg);border:2px dashed var(--line);color:var(--muted);font-weight:500;width:100%}

/* Communication */
.strip{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:3}
.strip-words{display:flex;flex-wrap:wrap;gap:6px;min-height:48px;align-items:center;padding:2px 4px}
.strip-words .ph{color:var(--muted);font-size:15px}
.word{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:12px;background:var(--bg);font-weight:500;font-size:15px}
.word img{width:22px;height:22px;border-radius:6px;object-fit:cover}
.meaning{display:flex;gap:10px;align-items:center;font-size:14px;background:var(--bg);border-radius:12px;padding:8px 10px}
.meaning .me{font-size:24px}
.meaning b{font-weight:600}
.strip-actions{display:grid;grid-template-columns:auto auto auto 1fr;gap:8px}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card-wrap{position:relative}
.card{border-radius:var(--r-md);padding:18px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:14px;font-weight:500;text-align:center;color:var(--ink);min-height:116px;justify-content:center;width:100%;line-height:1.25}
.card .e{font-size:38px;line-height:1}
.card img{width:52px;height:52px;object-fit:cover;border-radius:12px}
.mini{position:absolute;top:4px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--muted);font-size:15px;line-height:1;font-weight:600}
.mini.info{left:4px;font-family:Georgia,serif;font-style:italic;background:var(--surface);opacity:.85}
.mini.fav{right:4px;font-size:17px}
.mini.fav[aria-pressed="true"]{color:var(--butter-ink)}
.add-card{border:2px dashed var(--line);background:transparent;color:var(--muted)}

/* Routine */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.step{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);overflow:hidden}
.step-main{display:flex;align-items:center;gap:12px;padding:10px 12px;width:100%;text-align:left}
.step .e{width:46px;height:46px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:24px;flex:none}
.step .t{flex:1;min-width:0;display:flex;flex-direction:column}
.step .t strong{font-weight:500}
.step .t small{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.step.st-done .t strong{text-decoration:line-through;color:var(--muted)}
.step.st-skip{opacity:.65}
.step.now{box-shadow:inset 0 0 0 2px var(--sky-ink),var(--shadow)}
.step-actions{display:flex;gap:6px;padding:0 12px 12px 70px;flex-wrap:wrap}
.step-actions button{padding:8px 12px;border-radius:10px;font-size:13px;font-weight:500;background:var(--bg)}
.step-actions .ok{background:var(--sage);color:var(--sage-ink)}
.step-actions .go{background:var(--sky);color:var(--sky-ink)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tool{border-radius:var(--r-lg);padding:16px;text-align:left;display:flex;flex-direction:column;gap:8px}
.tool b{font-family:var(--f-display);font-size:17px;font-weight:600;color:var(--ink)}
.tool span{font-size:13px}
.tool .big{font-size:26px}

/* Diary */
.entries,.list{display:flex;flex-direction:column;gap:10px}
.entry{background:var(--surface);border-radius:var(--r-md);padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.entry header{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.entry p{font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.strategy{font-size:14px;color:var(--sage-ink);background:var(--sage);padding:8px 10px;border-radius:10px}
.insight{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.insight div{border-radius:var(--r-md);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.insight b{font-family:var(--f-display);font-size:18px;color:var(--ink)}
.insight span{font-size:13px}

/* Wellbeing */
.quick3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.quick3 button{border-radius:var(--r-md);padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:500;font-size:14px;text-align:center}
.quick3 .big{font-size:28px}
.snd{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;background:var(--surface);border-radius:var(--r-md);padding:12px 14px;box-shadow:var(--shadow)}
.snd .play{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:16px;grid-row:span 2}
.snd .play[aria-pressed="true"]{box-shadow:inset 0 0 0 3px currentColor}
.snd .nm{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.snd .nm b{font-weight:600}
.snd .nm small{color:var(--muted);font-size:13px}
.player{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:var(--lav);color:var(--lav-ink);border-radius:var(--r-lg);padding:12px 14px;display:flex;align-items:center;gap:12px}
.player .t{flex:1;min-width:0;font-size:14px}
.player b{display:block;color:var(--ink);font-weight:600;font-size:15px}

/* Professionals */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;padding:0 14px;box-shadow:var(--shadow)}
.search input{flex:1;border:0;background:none;padding:13px 0;min-width:0}
.search input:focus{outline:none}
.search:focus-within{box-shadow:0 0 0 3px var(--focus)}
.pro{background:var(--surface);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.pro .top{display:flex;gap:12px;align-items:center}
.avatar{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:19px;flex:none}
.pro .who{flex:1;min-width:0}
.pro .who b{font-family:var(--f-display);font-weight:600;font-size:18px;display:block}
.pro .who small{color:var(--muted);font-size:14px;display:block}
.pro .adapt{font-size:14px;color:var(--muted)}
.favbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted);font-size:20px;flex:none}
.favbtn[aria-pressed="true"]{color:var(--butter-ink)}
.slots{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.appt{background:var(--surface);border-radius:var(--r-md);padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0}
ul.plain{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

/* Profile */
.profile-card{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow)}
.profile-card .av{width:60px;height:60px;border-radius:18px;font-size:32px;display:grid;place-items:center;background:var(--lav);flex:none}
.setting{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);text-align:left;width:100%}
.setting .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:17px;font-weight:600}
.setting .t{flex:1;min-width:0;display:flex;flex-direction:column}
.setting .t small{color:var(--muted);font-size:13px}
details.guide{background:var(--surface);border-radius:var(--r-md);padding:4px 16px}
details.guide summary{padding:12px 0;font-weight:500;cursor:pointer}
details.guide ol{margin:0 0 14px;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:15px}

/* Overlays */
.sheet-bg{position:fixed;inset:0;background:var(--scrim);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;border-radius:24px 24px 0 0;max-height:92%;overflow-y:auto;
  padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-in{display:flex;flex-direction:column;gap:16px}
.sheet h2{font-size:22px}
.full{position:fixed;inset:0;z-index:25;background:var(--bg);overflow-y:auto;
  padding:calc(18px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.full-in{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:18px}
.full-in h2{font-size:22px}
.onb{z-index:50}
.prog{display:flex;gap:6px}
.prog i{flex:1;height:6px;border-radius:6px;background:var(--line)}
.prog i.on{background:var(--lav-ink)}
.stepcount{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.guide-card{flex:1;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px 16px;min-height:280px}
.guide-card .big-e{font-size:88px;line-height:1}
.guide-card b{font-family:var(--f-display);font-size:28px;font-weight:600;color:var(--ink);line-height:1.2}
.guide-card p{font-size:16px;max-width:30ch}
.show-text{flex:1;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:16px;text-align:center;padding:12px}
.show-text span{display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--f-display);font-size:30px;font-weight:600;line-height:1.15}
.show-text span i{font-style:normal;font-size:56px}
.show-text img{width:72px;height:72px;border-radius:16px;object-fit:cover}
.ft-big{flex:1;display:grid;grid-template-rows:1fr auto 1fr;gap:12px;min-height:420px}
.ft-panel{border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px}
.ft-panel small{font-size:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.ft-panel .big-e{font-size:72px;line-height:1}
.ft-panel b{font-family:var(--f-display);font-size:26px;font-weight:600;color:var(--ink)}
.ft-arrow{text-align:center;color:var(--muted);font-size:22px}
.choice-grid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:center}
.choice{border-radius:28px;padding:28px 12px;display:flex;flex-direction:column;align-items:center;gap:12px;font-family:var(--f-display);font-size:22px;font-weight:600;color:var(--ink)}
.choice .big-e{font-size:64px;line-height:1}
.choice[aria-pressed="true"]{box-shadow:inset 0 0 0 4px var(--lav-ink)}
.orb-wrap{flex:1;display:grid;place-items:center;min-height:300px}
.orb{width:220px;height:220px;border-radius:50%;background:radial-gradient(circle at 40% 35%,var(--sky),var(--lav));display:grid;place-items:center;text-align:center;color:var(--lav-ink);transform:scale(.6);transition-property:transform;transition-timing-function:ease-in-out}
.orb b{font-family:var(--f-display);font-size:26px;display:block;color:var(--ink)}
.orb span{font-size:32px;font-variant-numeric:tabular-nums}
.timer-ring{width:240px;height:240px;border-radius:50%;display:grid;place-items:center;margin:0 auto;max-width:100%}
.timer-ring div{width:190px;height:190px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-family:var(--f-display);font-size:44px;font-variant-numeric:tabular-nums}
.welcome-art{display:flex;justify-content:center;gap:10px;padding:26px 0 6px}
.welcome-art span{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-size:30px}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}
.tabbar nav{max-width:480px;margin:0 auto;display:grid;grid-auto-columns:1fr;grid-auto-flow:column;gap:4px}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:14px;color:var(--muted);text-decoration:none;font-size:11.5px;min-width:0;text-align:center;line-height:1.2}
.tabbar a svg{width:24px;height:24px}
.tabbar a[aria-current="page"]{color:var(--lav-ink);background:var(--lav);font-weight:500}

.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:14px;max-width:calc(100% - 32px);width:max-content;text-align:center;z-index:60}

:root[data-motion="reduce"] *{transition:none!important;animation:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:360px){.cards{grid-template-columns:repeat(2,1fr)}.quick3{grid-template-columns:1fr}}
.toolrow{display:flex;flex-wrap:wrap;gap:8px}
.lowbadge{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);color:var(--muted)}
.notif{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.notif .e{font-size:26px}
.notif small{display:block;color:var(--muted);font-size:12px}
.plan-sit{display:flex;flex-direction:column;gap:10px}
.plan-sit button{border-radius:var(--r-md);padding:18px 16px;text-align:left;font-size:18px;font-weight:500;background:var(--surface);box-shadow:var(--shadow)}
.plan-big{border-radius:var(--r-lg);padding:22px;display:flex;flex-direction:column;gap:10px}
.plan-big b{font-family:var(--f-display);font-size:24px;line-height:1.25}
.row-edit{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:var(--r-md);box-shadow:inset 0 0 0 1.5px var(--line)}
.manual-sec{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:var(--r-md);background:var(--surface);box-shadow:var(--shadow)}
.manual-sec p{white-space:pre-wrap}
</style>
</head>
<body>

<div class="app">
  <div class="topbar zoom">
    <a class="brand" href="#inicio">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20"><circle cx="9" cy="12" r="6" fill="var(--lav-ink)" opacity=".55"/><circle cx="15" cy="12" r="6" fill="var(--sky-ink)" opacity=".45"/></svg></span>
      Your Friend You
    </a>
    <a class="me-btn" href="#perfil" id="me-btn" aria-label="Perfil">🌱</a>
  </div>
  <main id="view" class="zoom"></main>
</div>

<div class="tabbar"><nav id="nav" class="zoom" aria-label="Navegação principal"></nav></div>
<div class="full" id="full" hidden role="dialog" aria-modal="true"></div>
<div class="sheet-bg" id="sheet-bg" hidden><div class="sheet zoom" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="full onb" id="onb" hidden role="dialog" aria-modal="true" aria-label="Boas-vindas"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
"use strict";
/* ================= utilidades ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function load(k, d){ try{ const v = localStorage.getItem("yfy:"+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem("yfy:"+k, JSON.stringify(v)); }catch(e){} }
let tt;
function toast(m){ const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2800); }
const hour = new Date().getHours();
const pad = n => String(n).padStart(2,"0");
function fmtDate(iso){ const d = new Date(iso), now = new Date(); const diff = Math.round((new Date(now.toDateString()) - new Date(d.toDateString()))/864e5);
  const dia = diff === 0 ? "Hoje" : diff === 1 ? "Ontem" : d.toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"short"}); return dia + " · " + pad(d.getHours())+":"+pad(d.getMinutes()); }
function agoAt(days, h, m){ const d = new Date(); d.setDate(d.getDate()-days); d.setHours(h, m, 0, 0); return d.toISOString(); }

/* ================= estado ================= */
const DEF = {
  profile:{name:"", avatar:"🌱", email:"", onboarded:false, logged:true},
  prefs:{z:1, theme:"auto", contrast:false, motion:false, rate:0.95, low:false},
  modules:{rot:true, com:true, dia:true, aut:true, bem:true, pro:true},
  notif:{rotina:true, diario:false, diarioHora:"21:00", consultas:true, silencioDe:"22:00", silencioAte:"07:00"},
  privacy:{homePreview:false, lockDiary:false},
  mood:null
};
let S = Object.assign({}, DEF, load("state", {}));
["profile","prefs","modules","notif","privacy"].forEach(k => S[k] = Object.assign({}, DEF[k], S[k] || {}));
const persist = () => save("state", S);

function applyPrefs(){
  const r = document.documentElement;
  r.style.setProperty("--z", S.prefs.z);
  if(S.prefs.theme === "auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", S.prefs.theme);
  if(S.prefs.contrast) r.setAttribute("data-contrast","high"); else r.removeAttribute("data-contrast");
  if(S.prefs.motion) r.setAttribute("data-motion","reduce"); else r.removeAttribute("data-motion");
  if(S.prefs.low) r.setAttribute("data-low",""); else r.removeAttribute("data-low");
  $("#me-btn").textContent = S.profile.avatar || "🌱";
}

/* ================= voz ================= */
function speak(text){
  try{
    if(!("speechSynthesis" in window)){ toast("Este navegador não tem voz disponível."); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = "pt-BR"; u.rate = S.prefs.rate;
    const vs = speechSynthesis.getVoices().filter(x => /^pt/i.test(x.lang));
    if(vs.length) u.voice = vs.find(x => /BR/i.test(x.lang)) || vs[0];
    speechSynthesis.speak(u);
  }catch(e){ toast("Não foi possível reproduzir a voz aqui."); }
}

/* ================= ícones ================= */
const IC = {
  inicio:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1z"/></svg>',
  com:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>',
  rot:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>',
  dia:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 4h10a2 2 0 0 1 2 2v14H8a2 2 0 0 1-2-2z"/><path d="M6 18a2 2 0 0 1 2-2h10M10 8h5"/></svg>',
  bem:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>',
  pro:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1-4 4-6 7-6s6 2 7 6"/></svg>',
  aut:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/><path d="M8.5 12h2l1-2 1.5 4 1-2h1.5"/></svg>',
  perfil:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>',
  speak:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h4l5 4V6L8 10z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg>',
  lock:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" style="flex:none;margin-top:2px"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>'
};
const MODS = [
  {k:"rot", hash:"rotina", name:"Organização", tn:"Organizar", desc:"Tarefas, cuidados e lembretes", c:"c-sky", tab:true},
  {k:"com", hash:"comunicacao", name:"Comunicação", tn:"Comunicar", desc:"Cards, voz e painéis", c:"c-lav", tab:true},
  {k:"dia", hash:"diario", name:"Meu espaço", desc:"Diário e manual pessoal", c:"c-peach", tab:true},
  {k:"aut", hash:"autorregulacao", name:"Autorregulação", desc:"Plano de apoio e estratégias", c:"c-rose", tab:false},
  {k:"bem", hash:"bem-estar", name:"Bem-estar sensorial", desc:"Sons e ambientes calmos", c:"c-sage", tab:false},
  {k:"pro", hash:"profissionais", name:"Rede de apoio", desc:"Profissionais e consultas", c:"c-butter", tab:false}
];

/* ================= navegação ================= */
const MODOF = {comunicacao:"com", rotina:"rot", diario:"dia", autorregulacao:"aut", "bem-estar":"bem", profissionais:"pro"};
let ROUTES = {};
let current = "inicio";
function route(){
  let v = (location.hash || "").slice(1);
  if(!ROUTES[v] || (MODOF[v] && !S.modules[MODOF[v]])) v = "inicio";
  const changed = v !== current; current = v;
  renderNav(); ROUTES[v]();
  if(changed) window.scrollTo(0,0);
}
function rerender(){ const y = window.scrollY; renderNav(); ROUTES[current](); window.scrollTo(0,y); }
function renderNav(){
  const items = [{h:"inicio",n:"Início",i:IC.inicio}];
  MODS.filter(m => m.tab && S.modules[m.k]).forEach(m => items.push({h:m.hash, n:m.tn || m.name, i:IC[m.k]}));
  items.push({h:"perfil",n:"Perfil",i:IC.perfil});
  $("#nav").innerHTML = items.map(t => `<a href="#${t.h}" ${t.h===current?'aria-current="page"':''}>${t.i}${t.n}</a>`).join("");
}
window.addEventListener("hashchange", route);

/* ================= overlays ================= */
let sheetClose = null;
function openSheet(html, onClose){ $("#sheet").innerHTML = `<div class="sheet-in">${html}</div>`; $("#sheet").dataset.kind = ""; $("#sheet-bg").hidden = false; $("#sheet").scrollTop = 0; sheetClose = onClose || null; }
function closeSheet(){ $("#sheet-bg").hidden = true; $("#sheet").innerHTML = ""; if(sheetClose){ const c = sheetClose; sheetClose = null; c(); } }
let fullClose = null;
function openFull(html, onClose){ $("#full").innerHTML = `<div class="full-in zoom">${html}</div>`; $("#full").hidden = false; $("#full").scrollTop = 0; fullClose = onClose || null; }
function closeFull(){ $("#full").hidden = true; $("#full").innerHTML = ""; stopBreath(); stopTimer(); if(fullClose){ const c = fullClose; fullClose = null; c(); } }
$("#sheet-bg").addEventListener("click", e => { if(e.target.id === "sheet-bg") closeSheet(); });
document.addEventListener("keydown", e => { if(e.key !== "Escape") return; if(!$("#sheet-bg").hidden) closeSheet(); else if(!$("#full").hidden) closeFull(); });

/* ================= ações (delegação) ================= */
const A = {}, TOGS = {};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]"); if(!el || el.disabled) return;
  const fn = A[el.dataset.a]; if(fn){ e.preventDefault(); fn(el, e); }
});
A.closeSheet = () => closeSheet();
A.closeFull = () => closeFull();
A.go = el => { closeSheet(); closeFull(); location.hash = el.dataset.id; };
A.say = el => speak(el.dataset.id);
A.tog = el => { const on = el.getAttribute("aria-checked") !== "true"; el.setAttribute("aria-checked", on); if(TOGS[el.dataset.id]) TOGS[el.dataset.id](on, el); };

function toggleHTML(id, on, title, sub){
  return `<button class="switch" role="switch" aria-checked="${!!on}" data-a="tog" data-id="${id}"><span class="t"><b>${title}</b>${sub?`<small>${sub}</small>`:""}</span><span class="tog" aria-hidden="true"></span></button>`;
}
const isOn = id => { const b = document.querySelector(`[data-a="tog"][data-id="${id}"]`); return !!b && b.getAttribute("aria-checked") === "true"; };
const EMOJIS = ["😊","😢","😠","😴","🤗","🙋","💧","🍎","🍞","🚻","🛏️","🎧","📚","🎨","🎮","🚶","🧸","🏠","🌳","🛁","💊","🪥","👕","🎒","🧹","🐶","🚌","💻","☕","🌱"];
function pickerHTML(id, sel){ return `<div class="emoji-pick" id="${id}">${EMOJIS.map(e => `<button type="button" aria-pressed="${e===sel}" data-a="pick" data-id="${e}" aria-label="Imagem ${e}">${e}</button>`).join("")}</div>`; }
A.pick = el => { el.parentElement.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed","false")); el.setAttribute("aria-pressed","true"); };
const picked = (id, fb) => { const b = document.querySelector(`#${id} [aria-pressed="true"]`); return b ? b.dataset.id : (fb || "⭐"); };
const progHTML = (n, i) => `<div class="prog" aria-hidden="true">${Array.from({length:n}, (_,k) => `<i class="${k<=i?"on":""}"></i>`).join("")}</div>`;

/* =========================================================
   BOAS-VINDAS, CADASTRO, LOGIN
   ========================================================= */
let onbStep = 0, onbSlide = 0, onbMode = "signup";
const SLIDES = [
  {art:["💬","🗓️","📖"], t:"Um app que se adapta a você", p:"Ferramentas de apoio para o dia a dia, no seu ritmo e do seu jeito."},
  {art:["🎧","🤝","🌿"], t:"Tudo em um só lugar", p:"Organização do dia, comunicação com voz, seu espaço pessoal, plano de apoio, sons calmos e uma rede de profissionais."},
  {art:["🔒","✋","💜"], t:"Você decide", p:"Você escolhe o que usar e o que compartilhar. Não pedimos diagnóstico."}
];
function renderOnb(){
  const o = $("#onb"); o.hidden = false;
  let h = "";
  if(onbMode === "login"){
    h = `<div class="head"><h1>Entrar</h1><p class="sub">Use o e-mail da sua conta.</p></div>
      <div class="field"><label for="l-email">E-mail</label><input id="l-email" type="email" autocomplete="email" value="${esc(S.profile.email)}"></div>
      <div class="field"><label for="l-pass">Senha</label><input id="l-pass" type="password" autocomplete="current-password"></div>
      <p class="err" id="l-err" hidden></p>
      <button class="btn solid block" data-a="login">Entrar</button>
      <button class="btn ghost block" data-a="forgot">Esqueci minha senha</button>
      <button class="btn ghost block" data-a="onbMode" data-id="signup">Criar uma conta nova</button>
      <p class="note">${IC.lock}<span>Protótipo: nenhum dado sai deste aparelho.</span></p>`;
  } else if(onbStep === 0){
    const s = SLIDES[onbSlide];
    h = `<div class="welcome-art" aria-hidden="true">${s.art.map((a,i) => `<span class="${["c-lav","c-sky","c-sage"][i]}">${a}</span>`).join("")}</div>
      <div class="head" style="text-align:center;align-items:center"><h1 style="font-size:30px">${s.t}</h1><p class="sub" style="max-width:34ch">${s.p}</p></div>
      ${progHTML(3, onbSlide)}
      <div style="flex:1"></div>
      <button class="btn solid block" data-a="onbNextSlide">${onbSlide < 2 ? "Continuar" : "Criar minha conta"}</button>
      <div class="btns"><button class="btn ghost" data-a="onbMode" data-id="login">Já tenho conta</button>${onbSlide<2?`<button class="btn ghost" data-a="onbSkipSlides">Pular apresentação</button>`:""}</div>`;
  } else {
    const head = `<div class="between"><span class="stepcount">Passo ${onbStep} de 4</span><button class="btn sm ghost" data-a="onbBack">Voltar</button></div>${progHTML(4, onbStep-1)}`;
    if(onbStep === 1) h = head + `<div class="head"><h1>Criar conta</h1><p class="sub">Só o necessário. Você pode mudar tudo depois.</p></div>
      <div class="field"><label for="s-name">Como você quer ser chamado(a/e)?</label><input id="s-name" maxlength="30" value="${esc(S.profile.name)}" placeholder="Nome ou apelido"></div>
      <div class="field"><label for="s-email">E-mail</label><input id="s-email" type="email" autocomplete="email" value="${esc(S.profile.email)}" placeholder="voce@exemplo.com"></div>
      <div class="field"><label for="s-pass">Senha</label><input id="s-pass" type="password" autocomplete="new-password"><small>Pelo menos 6 caracteres.</small></div>
      <p class="err" id="s-err" hidden></p>
      <p class="note">${IC.lock}<span>Não pedimos diagnóstico. Protótipo: nada é enviado para servidores.</span></p>
      <button class="btn solid block" data-a="onbSignup">Continuar</button>`;
    if(onbStep === 2) h = head + `<div class="head"><h1>Deixe do seu jeito</h1><p class="sub">As mudanças aparecem na hora.</p></div>` + accessHTML() +
      `<button class="btn solid block" data-a="onbNext">Continuar</button>`;
    if(onbStep === 3) h = head + `<div class="head"><h1>O que você quer usar?</h1><p class="sub">Escolha os módulos. Os outros ficam escondidos até você ligar.</p></div>` + modulesHTML() +
      `<button class="btn solid block" data-a="onbNext">Continuar</button>`;
    if(onbStep === 4) h = head + `<div class="head" style="text-align:center;align-items:center"><h1>Tudo pronto${S.profile.name?", "+esc(S.profile.name):""}.</h1><p class="sub" style="max-width:34ch">Escolha um ícone para você. Ele aparece no canto da tela.</p></div>
      ${pickerHTML("onb-av", S.profile.avatar)}
      <div style="flex:1"></div><button class="btn solid block" data-a="onbFinish">Entrar no app</button>`;
  }
  o.innerHTML = `<div class="full-in zoom">${h}</div>`; o.scrollTop = 0;
}
A.onbNextSlide = () => { if(onbSlide < 2) onbSlide++; else onbStep = 1; renderOnb(); };
A.onbSkipSlides = () => { onbStep = 1; renderOnb(); };
A.onbMode = el => { onbMode = el.dataset.id; if(onbMode === "signup"){ onbStep = 1; } renderOnb(); };
A.onbBack = () => { if(onbStep === 1){ onbStep = 0; onbSlide = 2; } else onbStep--; renderOnb(); };
A.onbNext = () => { onbStep++; renderOnb(); };
A.onbSignup = () => {
  const n = $("#s-name").value.trim(), m = $("#s-email").value.trim(), p = $("#s-pass").value, er = $("#s-err");
  let msg = "";
  if(!n) msg = "Escreva um nome ou apelido.";
  else if(!/^\S+@\S+\.\S+$/.test(m)) msg = "Confira o e-mail. Ele precisa ter @ e um domínio, como voce@exemplo.com.";
  else if(p.length < 6) msg = "A senha precisa ter pelo menos 6 caracteres.";
  if(msg){ er.textContent = msg; er.hidden = false; return; }
  S.profile.name = n; S.profile.email = m; persist(); onbStep = 2; renderOnb();
};
A.onbFinish = () => { S.profile.avatar = picked("onb-av", "🌱"); S.profile.onboarded = true; S.profile.logged = true; persist(); applyPrefs(); $("#onb").hidden = true; location.hash = "inicio"; rerender(); toast("Que bom ter você aqui."); };
A.login = () => {
  const m = $("#l-email").value.trim(), p = $("#l-pass").value, er = $("#l-err");
  if(!/^\S+@\S+\.\S+$/.test(m) || !p){ er.textContent = "Preencha o e-mail e a senha."; er.hidden = false; return; }

const PFILTERS = ["Online","Presencial","Neuroafirmativa","Libras","Comunicação alternativa","Sala com pouca luz","Sessão por texto"];

const findPro = id => PROS.find(p => p.id === id);
function proMatch(p){
  const hay = (p.n+" "+p.role+" "+p.area+" "+p.city+" "+p.tags.join(" ")+" "+p.mode.join(" ")).toLowerCase();
  return (!pQ || hay.includes(pQ.toLowerCase())) && (!pArea || p.area === pArea) && pF.every(f => hay.includes(f.toLowerCase()));
}
function proCard(p){ const on = proFavs.includes(p.id);
  return `<article class="pro"><div class="top"><div class="avatar ${p.c}">${p.ini}</div><div class="who"><b>${p.n}</b><small>${p.role}</small><small>${p.mode.join(" e ")} · ${p.city}</small></div>

function renderPro(){

    const list = PROS.filter(proMatch);

      <div class="chips" role="group" aria-label="Filtros">${PFILTERS.map(f => `<button class="chip" aria-pressed="${pF.includes(f)}" data-a="pFilter" data-id="${f}">${f}</button>`).join("")}</div>

  }
  $("#view").innerHTML = `<section class="screen">

    ${body}</section>`;
  const q = $("#pro-q"); if(q){ q.addEventListener("input", () => { pQ = q.value; const pos = q.selectionStart; rerender(); const n = $("#pro-q"); n.focus(); n.setSelectionRange(pos,pos); }); }
  const s = $("#pro-area"); if(s) s.addEventListener("change", () => { pArea = s.value; rerender(); });
}
A.pTab = el => { pTab = el.dataset.id; rerender(); };

let B = null;
const BSTEPS = ["Como prefere ser atendido(a/e)?","Escolha dia e horário","Adaptações que ajudam você","Confira e envie"];
const BADAPT = ["Comunicação por texto","Luz baixa","Sem contato visual obrigatório","Pausas durante a sessão","Levar acompanhante","Receber resumo por escrito","Sala de espera silenciosa"];
A.book = el => { const p = findPro(el.dataset.id); B = {p, i:0, mode:p.mode[0], day:"", time:"", ad:[], note:""}; renderBook(); };
function renderBook(){
  const {p, i} = B; let body = "";
  if(i === 0) body = `<div class="list">${p.mode.map(m => `<button class="setting" data-a="bMode" data-id="${m}" style="${B.mode===m?"box-shadow:inset 0 0 0 2px var(--lav-ink)":""}"><span class="ic ${m==="Online"?"c-sky":"c-peach"}">${m==="Online"?"💻":"🏠"}</span><span class="t"><b>${m}</b><small>${m==="Online"?"Por vídeo, áudio ou texto":p.space}</small></span>${B.mode===m?"✓":""}</button>`).join("")}</div>`;
  if(i === 1) body = Object.entries(p.slots).map(([d,hs]) => `<div class="section"><b>${d}</b><div class="chips">${hs.map(h => `<button class="chip" aria-pressed="${B.day===d&&B.time===h}" data-a="bSlot" data-d="${d}" data-id="${h}">${h}</button>`).join("")}</div></div>`).join("");
  if(i === 2) body = `<p class="sub">Escolha o que quiser. A pessoa recebe junto com o pedido.</p><div class="chips">${BADAPT.map(x => `<button class="chip" aria-pressed="${B.ad.includes(x)}" data-a="bAd" data-id="${x}">${x}</button>`).join("")}</div>
    <div class="field"><label for="b-note">Algo mais que queira contar (opcional)</label><textarea id="b-note" placeholder="Ex.: Prefiro receber mensagem em vez de ligação.">${esc(B.note)}</textarea></div>`;
  if(i === 3) body = `<div class="panel"><dl class="kv"><dt>Com</dt><dd>${p.n}</dd><dt>Como</dt><dd>${B.mode}</dd><dt>Quando</dt><dd>${B.day} às ${B.time}</dd><dt>Adaptações</dt><dd>${B.ad.length?B.ad.join(", "):"Nenhuma"}</dd>${B.note?`<dt>Recado</dt><dd>${esc(B.note)}</dd>`:""}</dl></div>
    <p class="note">${IC.lock}<span>Seu diário não é enviado. Só vão as informações acima.</span></p>`;
  const can = i !== 1 || B.time;
  openFull(`<div class="between"><span class="stepcount">Agendar com ${p.n} · Passo ${i+1} de 4</span><button class="btn sm ghost" data-a="closeFull">Cancelar</button></div>
    ${progHTML(4, i)}
    <h2>${BSTEPS[i]}</h2>${body}<div style="flex:1"></div>
    <div class="btns"><button class="btn ghost" data-a="bNav" data-id="-1" ${i===0?"disabled":""}>Voltar</button>${i<3?`<button class="btn solid" data-a="bNav" data-id="1" ${can?"":"disabled"}>Próximo</button>`:`<button class="btn solid" data-a="bSend">Enviar pedido</button>`}</div>`);
}
const bNote = () => { const n = $("#b-note"); if(n) B.note = n.value.trim(); };
A.bMode = el => { B.mode = el.dataset.id; renderBook(); };
A.bSlot = el => { B.day = el.dataset.d; B.time = el.dataset.id; renderBook(); };
A.bAd = el => { bNote(); const i = B.ad.indexOf(el.dataset.id); if(i >= 0) B.ad.splice(i,1); else B.ad.push(el.dataset.id); renderBook(); };
A.bNav = el => { bNote(); B.i = Math.max(0, Math.min(3, B.i + +el.dataset.id)); renderBook(); };
A.bSend = () => { appts.push({id:"ap"+Date.now(), pro:B.p.id, mode:B.mode, day:B.day, time:B.time, ad:B.ad, note:B.note, st:"pending"}); save("appts", appts); B = null; closeFull(); pTab = "agenda"; if(current !== "profissionais") location.hash = "profissionais"; else rerender(); toast("Pedido enviado (simulado). A confirmação aparece na Agenda."); };
A.apptCancel = el => {

A.roApply = () => {
  reorgUndo = JSON.stringify(acts); const n = {later:0, tomorrow:0, free:0, del:0};
  document.querySelectorAll("[data-ro]").forEach(sel => {

  const parts = [n.later && n.later+" para mais tarde", n.tomorrow && n.tomorrow+" para amanhã", n.free && n.free+" sem horário", n.del && n.del+" removido"+(n.del>1?"s":"")].filter(Boolean);

let panels = load("panels", DEFAULT_PANELS);
const savePanels = () => save("panels", panels);
A.panelEdit = el => {
  const p = panels.find(x => x.id === el.dataset.id);
  openSheet(`<h2>${p.e} Painel ${esc(p.n)}</h2><p class="sub">Toque para escolher os cards que aparecem neste painel. Os 6 primeiros ficam sempre à vista.</p>
    <div class="chips" id="pn-pick">${allCards().map(c => `<button class="chip" aria-pressed="${p.ids.includes(c.id)}" data-a="pnTog" data-id="${c.id}">${c.img?"🖼️":c.e} ${esc(c.t)}</button>`).join("")}</div>
    <div class="btns"><button class="btn warn" data-a="panelDel" data-id="${p.id}">Apagar painel</button><button class="btn solid" data-a="panelSave" data-id="${p.id}">Salvar</button></div>`);
};
A.pnTog = el => el.setAttribute("aria-pressed", el.getAttribute("aria-pressed") !== "true");
A.panelSave = el => {
  const p = panels.find(x => x.id === el.dataset.id), sel = Array.from(document.querySelectorAll("#pn-pick [aria-pressed='true']")).map(b => b.dataset.id);
  p.ids = p.ids.filter(id => sel.includes(id)).concat(sel.filter(id => !p.ids.includes(id))); savePanels(); closeSheet(); rerender(); toast("Painel salvo.");
};
A.panelDel = el => {
  if(el.dataset.confirm !== "1"){ el.dataset.confirm = "1"; el.textContent = "Toque de novo para apagar"; return; }
  panels = panels.filter(x => x.id !== el.dataset.id); savePanels(); curCat = "fav"; closeSheet(); rerender(); toast("Painel apagado. Os cards continuam salvos.");
};
A.panelNew = () => openSheet(`<h2>Novo painel</h2><p class="sub">Um conjunto de cards para um lugar ou situação.</p>
  <div class="field"><label for="pn-n">Nome</label><input id="pn-n" maxlength="24" placeholder="Ex.: Trabalho"></div>
  <div class="field"><span class="flabel">Imagem</span>${pickerHTML("pn-e","💻")}</div>
  <p class="err" id="pn-err" hidden></p>
  <div class="btns"><button class="btn ghost" data-a="closeSheet">Cancelar</button><button class="btn solid" data-a="panelCreate">Criar e escolher cards</button></div>`);
A.panelCreate = () => {
  const n = $("#pn-n").value.trim(); if(!n){ const e = $("#pn-err"); e.textContent = "Dê um nome para o painel."; e.hidden = false; return; }
  const p = {id:"pn"+Date.now(), e:picked("pn-e","💻"), n, ids:[]}; panels.push(p); savePanels(); curCat = "pn:"+p.id; rerender(); A.panelEdit({dataset:{id:p.id}});
};
const LIMITS = [["⏸️","Preciso de uma pausa."],["🙅","Por favor, não me toque."],["🤫","Preciso de silêncio agora."],["🕐","Falo com você depois."],["🚪","Preciso sair daqui um pouco."],["✍️","Prefiro conversar por escrito."]];
A.limits = () => openSheet(`<h2>Limites rápidos</h2><p class="sub">Toque para mostrar em tela cheia. Nada é enviado a ninguém.</p>
  <div class="list">${LIMITS.map((l,i) => `<button class="setting" data-a="limitShow" data-id="${i}"><span class="ic c-lav">${l[0]}</span><span class="t"><b>${l[1]}</b></span>›</button>`).join("")}</div>
  <button class="btn ghost block" data-a="closeSheet">Fechar</button>`);
A.limitShow = el => { const l = LIMITS[+el.dataset.id]; closeSheet(); showSentence([{e:l[0], t:l[1], say:l[1]}]); };

/* =========================================================
   MEU ESPAÇO: escrita livre e Meu manual pessoal
   ========================================================= */
A.quickEntry = () => {
  openSheet(`<h2>Escrever ou falar</h2><p class="sub">Um registro livre, sem perguntas. Fica só para você.</p>
    <div class="field"><label for="cap-t">O que você quer registrar?</label><textarea id="cap-t" style="min-height:140px"></textarea></div>
    <p class="err" id="cap-err" hidden></p>
    <div class="btns"><button class="btn ghost" data-a="capVoice" id="cap-mic">🎙️ Falar</button><button class="btn solid" data-a="quickSave">Salvar</button></div>`, () => { if(rec){ try{ rec.stop(); }catch(e){} rec = null; } });
};
A.quickSave = () => {
  const t = $("#cap-t").value.trim(); if(!t){ const e = $("#cap-err"); e.textContent = "Escreva ou fale alguma coisa antes de salvar."; e.hidden = false; return; }
  diary.push({id:"d"+Date.now(), date:new Date().toISOString(), emo:[], lvl:0, stim:[], text:t, strat:[], share:false}); saveDiary(); closeSheet(); rerender(); toast("Salvo só para você.");
};
const MANUAL = [
  ["com","💬","Como eu me comunico","Ex.: Às vezes prefiro escrever. Se eu demorar para responder, não é falta de interesse."],
  ["ajuda","🌿","O que me ajuda","Ex.: Avisar mudanças com antecedência. Instruções por escrito."],
  ["sobre","🌀","O que me sobrecarrega","Ex.: Lugares cheios, várias pessoas falando ao mesmo tempo, luz forte."],
  ["sens","🎧","Minhas preferências sensoriais","Ex.: Uso abafador. Prefiro luz baixa e roupas sem etiqueta."],
  ["dificil","🫶","Se eu estiver em um momento difícil","Ex.: Fale pouco e devagar. Me deixe ir para um lugar calmo."],
  ["evitar","🚫","O que evitar","Ex.: Toque sem avisar. Insistir para eu olhar nos olhos."]
];
let manual = load("manual", {});
A.manualEdit = () => openSheet(`<h2>📘 Meu manual pessoal</h2><p class="sub">Todas as partes são opcionais. Escreva do seu jeito.</p>
  ${MANUAL.map(m => `<div class="field"><label for="mn-${m[0]}">${m[1]} ${m[2]}</label><textarea id="mn-${m[0]}" placeholder="${esc(m[3])}">${esc(manual[m[0]]||"")}</textarea></div>`).join("")}
  <div class="btns"><button class="btn ghost" data-a="closeSheet">Cancelar</button><button class="btn solid" data-a="manualSave">Salvar</button></div>`);
A.manualSave = () => { MANUAL.forEach(m => manual[m[0]] = $("#mn-"+m[0]).value.trim()); save("manual", manual); closeSheet(); rerender(); toast("Manual salvo."); };
A.manualShow = () => {
  closeSheet(); const filled = MANUAL.filter(m => (manual[m[0]]||"").trim());
  openFull(`<div class="between"><h2>📘 ${S.profile.name ? "Manual de "+esc(S.profile.name) : "Meu manual pessoal"}</h2><button class="btn ghost" data-a="closeFull">Fechar</button></div>
    ${filled.length ? filled.map(m => `<div class="manual-sec"><b>${m[1]} ${m[2]}</b><p>${esc(manual[m[0]])}</p></div>`).join("")
      : `<p class="empty">Seu manual ainda está vazio. Toque em Editar para escrever a primeira parte.</p>`}
    <div class="btns"><button class="btn" data-a="manualExport">Exportar PDF</button><button class="btn" data-a="manualShare">Compartilhar</button></div>
    <button class="btn ghost block" data-a="manualEditFull">Editar</button>`);
};
A.manualEditFull = () => { closeFull(); A.manualEdit(); };
A.manualExport = () => toast("Na versão final, você vê uma prévia e escolhe as partes antes de gerar o PDF.");
A.manualShare = () => toast("Na versão final, você escolhe com quem compartilhar e pode cancelar o acesso quando quiser.");

/* =========================================================
   AUTORREGULAÇÃO: Meu Plano de Apoio, estratégias, baixa estimulação
   ========================================================= */
const RES = {
  none:"Sem recurso", sons:"Abrir sons calmos", low:"Ligar baixa estimulação", cards:"Abrir cards de comunicação", pausa:"Mostrar aviso de pausa",
  limites:"Abrir limites rápidos", manual:"Abrir meu manual", respirar:"Respirar agora", ground:"Fazer o 5-4-3-2-1"
};
const DEFAULT_PLANS = [
  {id:"pl1", e:"🏫", n:"Universidade", main:true, msg:"Você já passou por isso antes. Vai passar.", rows:[
    {s:"Ambiente muito barulhento", t:"Colocar os abafadores e sentar perto da porta.", r:"sons"},
    {s:"Excesso de estímulos", t:"Ir para a biblioteca ou outro lugar mais tranquilo.", r:"low"},
    {s:"Dificuldade de falar", t:"Usar os cards do painel Universidade.", r:"cards"},
    {s:"Necessidade de pausa", t:"Mostrar o aviso de pausa e sair por 10 minutos.", r:"pausa"},
    {s:"Dificuldade de organizar pensamentos", t:"Ler minhas instruções no manual pessoal.", r:"manual"},
    {s:"Sobrecarga", t:"Respirar devagar e usar minhas estratégias favoritas.", r:"respirar"}]},
  {id:"pl2", e:"🚌", n:"Transporte", main:false, msg:"Uma parada de cada vez.", rows:[
    {s:"Ônibus lotado", t:"Esperar o próximo, se der tempo.", r:"none"},
    {s:"Alguém encostando", t:"Mostrar o aviso de não me toque.", r:"limites"},
    {s:"Barulho e conversa", t:"Ligar o ruído marrom no fone.", r:"sons"}]}
];
let plans = load("plans", DEFAULT_PLANS);
const savePlans = () => save("plans", plans);
let strats = load("strats", STRAT.slice(0, 8));
let lowBefore = null;
function setLow(v){ S.prefs.low = v; persist(); applyPrefs(); }
A.lowOn = () => { closeSheet(); setLow(true); rerender(); toast("Baixa estimulação ligada."); };
A.lowOff = () => { setLow(false); rerender(); toast("Baixa estimulação desligada."); };
TOGS.low = v => { setLow(v); rerender(); };

function renderAut(){
  $("#view").innerHTML = `<section class="screen">
    <a class="back" href="#inicio">← Início</a>
    <div class="head"><h1>Autorregulação</h1><p class="sub">Prepare com calma o que ajuda nos momentos difíceis. O app não tenta adivinhar como você está: você abre quando quiser.</p></div>
    ${toggleHTML("low", S.prefs.low, "Modo de baixa estimulação", "Menos cor e nenhuma animação, em todo o app")}
    <div class="section"><div class="between"><h2 class="label">Meus planos de apoio</h2><button class="btn sm ghost" data-a="planEdit">＋ Novo plano</button></div>
      ${plans.length ? `<div class="list">${plans.map(p => `<div class="setting"><button class="t" data-a="planUse" data-id="${p.id}" style="text-align:left;flex-direction:row;align-items:center;gap:14px"><span class="ic c-rose">${p.e}</span><span style="display:flex;flex-direction:column;min-width:0"><b>${esc(p.n)}</b><small>${p.main?"Principal · ":""}${p.rows.length} ${p.rows.length===1?"situação":"situações"}</small></span></button><button class="btn sm ghost" data-a="planEdit" data-id="${p.id}">Editar</button></div>`).join("")}</div>`
        : `<p class="empty">Crie um plano para um lugar ou situação, como universidade, trabalho ou transporte.</p>`}</div>
    <div class="section"><h2 class="label">Para agora</h2><div class="quick3">
      <button class="c-sky" data-a="breath"><span class="big" aria-hidden="true">🫧</span>Respirar</button>
      <button class="c-sage" data-a="ground"><span class="big" aria-hidden="true">🖐️</span>5-4-3-2-1</button>
      ${S.modules.bem ? `<button class="c-lav" data-a="go" data-id="bem-estar"><span class="big" aria-hidden="true">🎧</span>Sons calmos</button>` : `<button class="c-lav" data-a="limits"><span class="big" aria-hidden="true">✋</span>Limites</button>`}
    </div></div>
    <div class="section"><div class="between"><h2 class="label">Minhas estratégias</h2><button class="btn sm ghost" data-a="stratNew">＋ Adicionar</button></div>
      <p class="sub" style="font-size:14px">O que costuma funcionar para você. Elas aparecem para escolher no plano e no registro guiado.</p>
      <div class="chips">${strats.map((x,i) => `<button class="chip" data-a="stratDel" data-id="${i}" aria-label="${esc(x)}. Toque para remover">${esc(x)} ✕</button>`).join("")}</div></div>
    <p class="note">${IC.lock}<span>Planos e estratégias ficam só neste aparelho. Nenhum contato é acionado sem você tocar.</span></p>
  </section>`;
}
A.stratNew = () => openSheet(`<h2>Nova estratégia</h2><div class="field"><label for="st-n">O que ajuda você?</label><input id="st-n" maxlength="40" placeholder="Ex.: Segurar meu chaveiro de pelúcia"></div>
  <div class="btns"><button class="btn ghost" data-a="closeSheet">Cancelar</button><button class="btn solid" data-a="stratSave">Adicionar</button></div>`);
A.stratSave = () => { const v = $("#st-n").value.trim(); if(!v) return closeSheet(); strats.push("✨ " + v); save("strats", strats); closeSheet(); rerender(); toast("Estratégia adicionada."); };
A.stratDel = el => { const i = +el.dataset.id, x = strats[i]; if(el.dataset.confirm !== "1"){ el.dataset.confirm = "1"; el.textContent = "Remover? Toque de novo"; return; } strats.splice(i,1); save("strats", strats); rerender(); toast(x + " removida."); };

A.planMain = () => { closeSheet(); const p = plans.find(x => x.main) || plans[0]; if(!p){ location.hash = "autorregulacao"; return toast("Crie seu primeiro plano de apoio."); } A.planUse({dataset:{id:p.id}}); };
A.planUse = el => {
  const p = plans.find(x => x.id === el.dataset.id); closeSheet();
  if(lowBefore === null){ lowBefore = S.prefs.low; document.documentElement.setAttribute("data-low",""); }
  openFull(`<div class="between"><span class="stepcount">${p.e} Plano ${esc(p.n)}</span><button class="btn sm ghost" data-a="closeFull">Fechar</button></div>
    ${p.msg ? `<p class="plan-big c-rose" style="font-size:18px">${esc(p.msg)}</p>` : ""}
    <h2>O que está acontecendo?</h2>
    <div class="plan-sit">${p.rows.map((r,i) => `<button data-a="planSit" data-id="${p.id}" data-k="${i}">${esc(r.s)}</button>`).join("")}</div>
    ${plans.length > 1 ? `<div class="chips">${plans.filter(x => x.id !== p.id).map(x => `<button class="chip" data-a="planUse" data-id="${x.id}">${x.e} ${esc(x.n)}</button>`).join("")}</div>` : ""}`, restoreLow);
};
function restoreLow(){ if(lowBefore !== null){ if(!lowBefore) document.documentElement.removeAttribute("data-low"); lowBefore = null; } }
A.planSit = el => {
  const p = plans.find(x => x.id === el.dataset.id), r = p.rows[+el.dataset.k];
  const keep = fullClose; fullClose = null;
  openFull(`<div class="between"><button class="btn sm ghost" data-a="planUse" data-id="${p.id}">← Situações</button><button class="btn sm ghost" data-a="closeFull">Fechar</button></div>
    <span class="stepcount">${esc(r.s)}</span>
    <div class="plan-big c-sage"><b>${esc(r.t)}</b></div>
    <button class="btn ghost block" data-a="say" data-id="${esc(r.t)}">${IC.speak}Ouvir</button>
    ${r.r && r.r !== "none" ? `<button class="btn solid block" data-a="planRes" data-id="${r.r}" data-p="${p.id}">${RES[r.r]}</button>` : ""}`, keep);
};
A.planRes = el => {
  const r = el.dataset.id, pid = el.dataset.p; closeFull();
  if(r === "sons") location.hash = "bem-estar";
  if(r === "low"){ setLow(true); rerender(); toast("Baixa estimulação ligada."); }
  if(r === "cards"){ const pn = panels.find(x => x.id === (pid === "pl1" ? "univ" : pid === "pl2" ? "transp" : "")); curCat = pn ? "pn:"+pn.id : "fav"; location.hash = "comunicacao"; if(current === "comunicacao") rerender(); }
  if(r === "pausa") showSentence([{e:"⏸️", t:"Preciso de uma pausa. Volto em alguns minutos.", say:"Preciso de uma pausa. Volto em alguns minutos."}]);
  if(r === "limites") A.limits();
  if(r === "manual") A.manualShow();
  if(r === "respirar") A.breath();
  if(r === "ground") A.ground();
};
let PE = null;
A.planEdit = el => {
  const src = el && el.dataset && el.dataset.id ? plans.find(x => x.id === el.dataset.id) : null;
  PE = src ? JSON.parse(JSON.stringify(src)) : {id:"pl"+Date.now(), e:"🏠", n:"", main:!plans.length, msg:"", rows:[{s:"", t:"", r:"none"}], isNew:true};
  renderPE();
};
function peCollect(){
  const n = $("#pe-n"); if(!n) return; PE.n = n.value.trim(); PE.msg = $("#pe-msg").value.trim(); PE.e = picked("pe-e", PE.e); PE.main = isOn("pe-main");
  PE.rows = PE.rows.map((r,i) => ({s:$("#pe-s"+i).value.trim(), t:$("#pe-t"+i).value.trim(), r:$("#pe-r"+i).value}));
}
function renderPE(){
  openSheet(`<h2>${PE.isNew ? "Novo plano de apoio" : "Editar plano"}</h2><p class="sub">Para cada situação difícil, escreva o que ajuda e, se quiser, ligue um recurso do app.</p>
    <div class="field"><label for="pe-n">Para onde ou quando é este plano?</label><input id="pe-n" maxlength="30" value="${esc(PE.n)}" placeholder="Ex.: Trabalho, consultas, festas"></div>
    <div class="field"><span class="flabel">Imagem</span>${pickerHTML("pe-e", PE.e)}</div>
    <div class="field"><label for="pe-msg">Uma mensagem para você mesmo(a/e) (opcional)</label><input id="pe-msg" maxlength="80" value="${esc(PE.msg)}" placeholder="Ex.: Vai passar. Você sabe o que fazer."></div>
    ${toggleHTML("pe-main", PE.main, "Plano principal", "Abre direto pelo atalho Meu plano de apoio")}
    ${PE.rows.map((r,i) => `<div class="row-edit"><span class="stepcount">Situação ${i+1}</span>
      <div class="field"><label for="pe-s${i}">Quando…</label><input id="pe-s${i}" maxlength="50" value="${esc(r.s)}" placeholder="Ex.: Muito barulho"></div>
      <div class="field"><label for="pe-t${i}">O que me ajuda</label><input id="pe-t${i}" maxlength="100" value="${esc(r.t)}" placeholder="Ex.: Colocar o abafador" list="pe-strats"></div>
      <div class="field"><label for="pe-r${i}">Recurso do app</label><select id="pe-r${i}">${Object.entries(RES).map(([k,v]) => `<option value="${k}" ${r.r===k?"selected":""}>${v}</option>`).join("")}</select></div>
      ${PE.rows.length > 1 ? `<button class="btn sm ghost" data-a="peDelRow" data-id="${i}">Remover situação</button>` : ""}</div>`).join("")}
    <datalist id="pe-strats">${strats.map(x => `<option value="${esc(x.replace(/^\S+\s/, ""))}">`).join("")}</datalist>
    <button class="btn ghost block" data-a="peAddRow">＋ Outra situação</button>
    <p class="err" id="pe-err" hidden></p>
    <div class="btns">${PE.isNew ? `<button class="btn ghost" data-a="closeSheet">Cancelar</button>` : `<button class="btn warn" data-a="planDel" data-id="${PE.id}">Apagar plano</button>`}<button class="btn solid" data-a="planSave">Salvar plano</button></div>`);
}
A.peAddRow = () => { peCollect(); PE.rows.push({s:"", t:"", r:"none"}); renderPE(); };
A.peDelRow = el => { peCollect(); PE.rows.splice(+el.dataset.id, 1); renderPE(); };
A.planSave = () => {
  peCollect(); PE.rows = PE.rows.filter(r => r.s || r.t);
  if(!PE.n || !PE.rows.length){ const e = $("#pe-err"); e.textContent = !PE.n ? "Dê um nome para o plano." : "Preencha pelo menos uma situação."; e.hidden = false; if(!PE.rows.length) PE.rows = [{s:"", t:"", r:"none"}]; return; }
  PE.rows.forEach(r => { if(!r.s) r.s = "Situação"; if(!r.t) r.t = "—"; });
  const isNew = PE.isNew; delete PE.isNew;
  if(PE.main) plans.forEach(p => p.main = false);
  const i = plans.findIndex(p => p.id === PE.id); if(i >= 0) plans[i] = PE; else plans.push(PE);
  if(!plans.some(p => p.main)) plans[0].main = true;
  savePlans(); PE = null; closeSheet(); rerender(); toast(isNew ? "Plano criado." : "Plano salvo.");
};
A.planDel = el => {
  if(el.dataset.confirm !== "1"){ el.dataset.confirm = "1"; el.textContent = "Toque de novo para apagar"; return; }
  plans = plans.filter(p => p.id !== el.dataset.id); if(plans.length && !plans.some(p => p.main)) plans[0].main = true; savePlans(); PE = null; closeSheet(); rerender(); toast("Plano apagado.");
};

/* ================= início ================= */
ROUTES = {inicio:renderHome, comunicacao:renderCom, rotina:renderRot, diario:renderDia, autorregulacao:renderAut, "bem-estar":renderBem, profissionais:renderPro, perfil:renderPerfil};
applyPrefs();
route();
if(!S.profile.onboarded) renderOnb();
else if(!S.profile.logged){ onbMode = "login"; renderOnb(); }
})();
</script>
</body>
